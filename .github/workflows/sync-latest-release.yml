name: Sync latest app release

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [release-published]

permissions:
  contents: write

concurrency:
  group: website-content-updates
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website source
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Synchronize the latest public release
        id: sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/sync-latest-release.mjs
          if git diff --quiet -- src/data/download-manifest.json src/content/changelog/current.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.sync.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile
      - name: Validate synchronized website
        if: steps.sync.outputs.changed == 'true'
        run: |
          pnpm test
          pnpm run check
          pnpm run build
          pnpm run check:site
      - name: Commit the synchronized release
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/download-manifest.json src/content/changelog/current.md
          git commit -m "chore: sync latest app release"
          git pull --rebase origin main
          git push origin HEAD:main
