name: Refresh download statistics

on:
  schedule:
    # GitHub cron uses UTC. 22:00 UTC is 06:00 China Standard Time (UTC+8).
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Refresh now even if today's snapshot already exists
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: download-statistics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Collect public release download counts
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force }}" == "true" ]]; then
            node scripts/update-download-stats.mjs --force --if-due-days 1
          else
            node scripts/update-download-stats.mjs --force --if-due-days 1
          fi
      - name: Validate statistics snapshot
        run: node scripts/validate-download-stats.mjs
      - name: Commit a due snapshot
        id: commit
        run: |
          if git diff --quiet -- src/data/download-stats.json; then
            echo "No statistics update was due."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/download-stats.json
          git commit -m "chore: refresh download statistics"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy the refreshed statistics
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY" --ref main
